[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-omnitech"
version = "0.1.1"
description = "NEXUS OMNITECH by LMF Informática - Diagnostics & Repair Platform (núcleo)"
requires-python = ">=3.12"
dependencies = []  # o núcleo usa apenas a biblioteca padrão

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nexus = "nexus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
