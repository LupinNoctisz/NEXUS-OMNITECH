name: Interface (.NET/WPF)

on:
  push:
    branches: [main, "feat/**"]
    paths: ["ui/**", "src/**", "modules/**", "installer/**", "scripts/dump_rpc_fixtures.py", ".github/workflows/dotnet.yml"]
  pull_request:
    paths: ["ui/**", "src/**", "modules/**", "installer/**", "scripts/dump_rpc_fixtures.py", ".github/workflows/dotnet.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Compilar e testar (Windows)
    runs-on: windows-latest
    env:
      NEXUS_REQUIRE_E2E: "1"          # no CI, a ausência do núcleo/Python é falha, não "ignorado"
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restaurar
        run: dotnet restore ui/Nexus.sln
      - name: Compilar (inclui o WPF)
        run: dotnet build ui/Nexus.sln --no-restore -c Release -warnaserror:false
      - name: Testes (contrato, ViewModels, JSON-RPC e ponta a ponta com o núcleo real)
        run: dotnet test ui/Nexus.Tests/Nexus.Tests.csproj --no-build -c Release --logger "trx;LogFileName=resultado.trx"
        env:
          NEXUS_PYTHON: python
          NEXUS_CORE_PATH: ${{ github.workspace }}/src
      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-testes-dotnet
          path: "**/resultado.trx"

  installer:
    name: Instalador (gerar + instalar/abrir/atualizar/desinstalar)
    runs-on: windows-latest
    needs: build-test
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Gerar o instalador
        shell: pwsh
        run: ./installer/build.ps1 -Version 0.1.1
      - name: Testar o instalador (instalar, abrir, atualizar, desinstalar)
        shell: pwsh
        run: ./installer/test-installer.ps1 -Version 0.1.1 -NewVersion 0.1.2
      - name: Publicar instalador como artefato do CI (não é uma release)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NexusOmnitech-Setup-0.1.1
          path: |
            build/installer/NexusOmnitech-Setup-0.1.1.exe
            build/installer/NexusOmnitech-Setup-0.1.1.exe.sha256
          if-no-files-found: error
